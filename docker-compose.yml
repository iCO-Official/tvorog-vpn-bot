# Бот в Docker. WireGuard (wg0) должен работать на самом сервере
# (его настраивает setup_server.sh) — бот управляет им через network_mode: host.
services:
  tvorog-vpn-bot:
    build: .
    container_name: tvorog-vpn-bot
    restart: unless-stopped
    env_file: .env
    environment:
      - TZ=Europe/Moscow
      - DATABASE_PATH=/app/data/tvorog_vpn.db
      - PERSISTENCE_PATH=/app/data/bot_state.pickle
    volumes:
      - ./data:/app/data
      - ./configs:/app/configs
      - /etc/wireguard:/etc/wireguard:ro
    network_mode: host
    cap_add:
      - NET_ADMIN
