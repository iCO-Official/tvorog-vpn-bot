<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Творог VPN</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
/* Цвета берутся из темы Telegram — приложение выглядит как часть мессенджера.
   Один фирменный цвет (--accent) + зелёный только для статуса «активна». */
:root {
  --bg: var(--tg-theme-secondary-bg-color, #0f0f10);
  --surface: var(--tg-theme-section-bg-color, var(--tg-theme-bg-color, #1c1c1e));
  --text: var(--tg-theme-text-color, #f2f2f3);
  --hint: var(--tg-theme-hint-color, #8d8d93);
  --accent: var(--tg-theme-button-color, #3e88f7);
  --accent-text: var(--tg-theme-button-text-color, #ffffff);
  --danger: var(--tg-theme-destructive-text-color, #eb5545);
  --ok: #30b85a;
  --accent-soft: color-mix(in srgb, var(--accent) 13%, transparent);
  --fill: color-mix(in srgb, var(--hint) 12%, transparent);
  --line: color-mix(in srgb, var(--hint) 22%, transparent);
  --r: 14px;
  --tabbar-h: 58px;
  --safe-bottom: max(env(safe-area-inset-bottom), var(--tg-safe-area-inset-bottom, 0px));
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--text); }
body {
  font: 16px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing: antialiased; min-height: 100vh; overscroll-behavior: none;
}
button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; text-align: inherit; }
.i { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.i.s { width: 18px; height: 18px; }

.app { max-width: 540px; margin: 0 auto; padding: 8px 16px calc(var(--tabbar-h) + var(--safe-bottom) + 24px); }
.screen { display: none; }
.screen.active { display: block; animation: fade .2s ease-out; }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }

/* Заголовки */
.head { display: flex; align-items: center; gap: 10px; padding: 10px 4px 14px; }
.mark { width: 30px; height: 30px; border-radius: 9px; background: var(--accent); color: var(--accent-text); display: grid; place-items: center; font-weight: 800; font-size: 17px; letter-spacing: -.5px; }
.head-title { font-weight: 700; font-size: 17px; }
.head-tag { margin-left: auto; font-size: 12px; color: var(--hint); border: 1px solid var(--line); border-radius: 6px; padding: 2px 7px; }
h1 { font-size: 24px; line-height: 1.2; font-weight: 700; letter-spacing: -.3px; margin: 6px 4px 4px; }
.lead { color: var(--hint); font-size: 15px; margin: 0 4px 18px; }
.cap { font-size: 13px; text-transform: uppercase; letter-spacing: .3px; color: var(--hint); margin: 24px 16px 7px; }
.foot { font-size: 13px; color: var(--hint); margin: 7px 16px 0; }

/* Поверхности и списки в стиле настроек Telegram */
.box { background: var(--surface); border-radius: var(--r); overflow: hidden; }
.row { display: flex; align-items: center; gap: 14px; width: 100%; min-height: 50px; padding: 10px 16px; position: relative; }
.row + .row::before { content: ""; position: absolute; top: 0; right: 0; left: 60px; border-top: 1px solid var(--line); }
.row.plain + .row.plain::before, .row.plain + .row::before { left: 16px; }
button.row:active { background: var(--fill); }
.ico { width: 30px; height: 30px; border-radius: 8px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; flex: none; }
.ico .i { width: 18px; height: 18px; }
.row-main { flex: 1; min-width: 0; }
.row-sub { font-size: 14px; color: var(--hint); margin-top: 1px; }
.row-val { color: var(--hint); font-size: 15px; white-space: nowrap; }
.chev { color: var(--hint); opacity: .6; width: 16px; height: 16px; }

/* Кнопки */
.btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; height: 50px; border-radius: 12px; font-weight: 600; font-size: 16px; transition: opacity .15s; text-align: center; }
.btn:active { opacity: .75; }
.btn.main { background: var(--accent); color: var(--accent-text); }
.btn.soft { background: var(--accent-soft); color: var(--accent); }
.btn[disabled] { opacity: .5; pointer-events: none; }
.spin { width: 18px; height: 18px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; animation: rot .7s linear infinite; }
@keyframes rot { to { transform: rotate(360deg); } }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

/* Главная: подписка */
.sub { padding: 18px 16px 16px; }
.sub-top { display: flex; align-items: center; justify-content: space-between; color: var(--hint); font-size: 14px; }
.state { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; font-size: 13px; }
.state::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--hint); }
.state.on { color: var(--ok); }
.state.on::before { background: var(--ok); }
.big { font-size: 34px; font-weight: 700; letter-spacing: -.8px; margin: 10px 0 0; line-height: 1.1; }
.big small { font-size: 17px; font-weight: 600; letter-spacing: 0; color: var(--hint); }
.sub-date { color: var(--hint); font-size: 15px; margin-top: 3px; }
.bar { height: 6px; border-radius: 3px; background: var(--fill); margin: 14px 0 16px; overflow: hidden; }
.bar > span { display: block; height: 100%; width: 0; border-radius: 3px; background: var(--ok); transition: width .8s cubic-bezier(.2,.8,.2,1); }
.sub-text { color: var(--hint); font-size: 15px; margin: 8px 0 16px; }

.promo { display: flex; align-items: center; gap: 14px; padding: 14px 16px; width: 100%; background: var(--accent-soft); border-radius: var(--r); margin-top: 10px; }
.promo-title { font-weight: 600; color: var(--accent); }
.promo-sub { font-size: 14px; color: var(--hint); margin-top: 1px; }
.promo .ico { background: var(--accent); color: var(--accent-text); }

/* Тарифы */
.plan { display: flex; align-items: center; gap: 14px; width: 100%; padding: 14px 16px; position: relative; }
.plan + .plan::before { content: ""; position: absolute; top: 0; right: 0; left: 52px; border-top: 1px solid var(--line); }
.radio { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line); flex: none; display: grid; place-items: center; }
.plan.sel .radio { border-color: var(--accent); background: var(--accent); }
.plan.sel .radio::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--accent-text); }
.plan-name { font-weight: 600; display: flex; align-items: center; gap: 8px; }
.tag { font-size: 12px; font-weight: 600; color: var(--accent); background: var(--accent-soft); padding: 2px 7px; border-radius: 6px; }
.price { text-align: right; white-space: nowrap; }
.price b { font-size: 17px; font-weight: 600; }
.price div { font-size: 13px; color: var(--hint); margin-top: 1px; }

.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 2px; padding: 2px; background: var(--fill); border-radius: 10px; }
.seg button { height: 36px; border-radius: 8px; font-size: 14px; font-weight: 600; color: var(--hint); text-align: center; }
.seg button.on { background: var(--surface); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.12); }

.paybar { position: fixed; left: 0; right: 0; bottom: calc(var(--tabbar-h) + var(--safe-bottom)); z-index: 5; padding: 10px 16px 12px; background: var(--bg); border-top: 1px solid var(--line); }
.paybar > div { max-width: 508px; margin: 0 auto; }
.paynote { text-align: center; font-size: 13px; color: var(--hint); margin-top: 7px; }
.pay-space { height: 96px; }

/* Подключение */
.plats { display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; padding: 2px; background: var(--fill); border-radius: 10px; margin-bottom: 10px; }
.plats button { height: 36px; border-radius: 8px; font-size: 13px; font-weight: 600; color: var(--hint); text-align: center; }
.plats button.on { background: var(--surface); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.num { width: 26px; height: 26px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font-size: 14px; font-weight: 700; display: grid; place-items: center; flex: none; }
.num.done { background: var(--ok); color: #fff; }
.num .i { width: 15px; height: 15px; stroke-width: 2.4; }
.qr { width: 216px; height: 216px; margin: 20px auto 12px; padding: 10px; background: #fff; border-radius: 12px; }
.qr img { width: 100%; height: 100%; display: block; image-rendering: pixelated; }
.code { font: 12px/1.5 ui-monospace, "SF Mono", Menlo, monospace; color: var(--hint); background: var(--fill); border-radius: 10px; padding: 10px 12px; margin: 0 16px 12px; white-space: pre; overflow: hidden; }

/* Друзья */
.ref-hero { padding: 20px 16px 16px; }
.ref-num { font-size: 40px; font-weight: 700; letter-spacing: -1px; color: var(--accent); line-height: 1; }
.ref-text { font-size: 15px; margin-top: 6px; }
.ref-sub { font-size: 14px; color: var(--hint); margin-top: 4px; }
.link { display: flex; align-items: center; gap: 10px; background: var(--fill); border-radius: 10px; padding: 0 6px 0 12px; height: 44px; margin: 16px 0 10px; }
.link span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; color: var(--hint); }
.link button { width: 36px; height: 36px; display: grid; place-items: center; color: var(--accent); border-radius: 8px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); }
.stat { padding: 14px 8px; text-align: center; }
.stat + .stat { border-left: 1px solid var(--line); }
.stat b { display: block; font-size: 22px; font-weight: 700; }
.stat span { font-size: 13px; color: var(--hint); }
.ava { width: 36px; height: 36px; border-radius: 50%; background: var(--fill); color: var(--hint); display: grid; place-items: center; font-weight: 600; font-size: 15px; flex: none; }
.badge { font-size: 13px; font-weight: 600; white-space: nowrap; }
.badge.paid { color: var(--ok); }
.badge.trial { color: var(--accent); }
.badge.joined { color: var(--hint); font-weight: 500; }
.empty { padding: 22px 16px; text-align: center; color: var(--hint); font-size: 15px; }

/* Профиль */
.me { display: flex; flex-direction: column; align-items: center; padding: 8px 0 4px; }
.me-ava { width: 84px; height: 84px; border-radius: 50%; background: var(--accent); color: var(--accent-text); display: grid; place-items: center; font-size: 32px; font-weight: 600; overflow: hidden; }
.me-ava img { width: 100%; height: 100%; object-fit: cover; }
.me-name { font-size: 21px; font-weight: 700; margin-top: 10px; }
.me-sub { color: var(--hint); font-size: 15px; }

/* Нижняя панель */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: var(--safe-bottom); }
.tabbar > div { max-width: 540px; margin: 0 auto; height: var(--tabbar-h); display: grid; grid-template-columns: repeat(5, 1fr); }
.tab { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; font-weight: 500; color: var(--hint); text-align: center; }
.tab .i { width: 24px; height: 24px; }
.tab.on { color: var(--accent); }

/* Шторка */
.dim { position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,.4); opacity: 0; pointer-events: none; transition: opacity .2s; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; max-height: 86vh; overflow-y: auto; background: var(--bg); border-radius: 14px 14px 0 0; padding: 8px 16px calc(20px + var(--safe-bottom)); transform: translateY(102%); transition: transform .28s cubic-bezier(.2,.8,.2,1); }
.sheet > div { max-width: 508px; margin: 0 auto; }
.grab { width: 36px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 10px; }
body.sheet-open .dim { opacity: 1; pointer-events: auto; }
body.sheet-open .sheet { transform: none; }
.cities { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.cities button { background: var(--surface); border-radius: 10px; padding: 13px 14px; font-weight: 500; }
.cities button:active { background: var(--fill); }

/* Экран результата */
.done { position: fixed; inset: 0; z-index: 30; background: var(--bg); display: none; flex-direction: column; align-items: center; justify-content: center; padding: 24px 24px calc(24px + var(--safe-bottom)); text-align: center; }
.done.show { display: flex; animation: fade .2s ease-out; }
.done-ico { width: 72px; height: 72px; border-radius: 50%; background: var(--ok); color: #fff; display: grid; place-items: center; animation: pop .35s cubic-bezier(.2,1.3,.4,1); }
.done-ico .i { width: 38px; height: 38px; stroke-width: 2.6; }
@keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: none; opacity: 1; } }
.done h2 { font-size: 22px; margin: 18px 0 6px; }
.done p { color: var(--hint); margin: 0 0 24px; max-width: 320px; font-size: 15px; }
.done .btn { max-width: 340px; }
.done .btn + .btn { margin-top: 8px; }

/* Уведомление */
.toast { position: fixed; left: 50%; top: calc(10px + env(safe-area-inset-top)); z-index: 40; transform: translate(-50%, -10px); opacity: 0; visibility: hidden; width: max-content; max-width: calc(100% - 32px); background: rgba(40,40,42,.96); color: #fff; padding: 10px 14px; border-radius: 10px; font-size: 14px; font-weight: 500; transition: .2s; display: flex; align-items: center; gap: 8px; }
.toast.show { opacity: 1; visibility: visible; transform: translate(-50%, 0); }

/* Загрузка */
.sk { background: var(--surface); border-radius: var(--r); position: relative; overflow: hidden; }
.sk::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, var(--fill), transparent); animation: sh 1.2s infinite; transform: translateX(-100%); }
@keyframes sh { to { transform: translateX(100%); } }
.gap { height: 10px; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<main class="app">
  <div id="loading">
    <div class="sk" style="height:36px;width:50%;margin:10px 0 16px"></div>
    <div class="sk" style="height:220px"></div><div class="gap"></div>
    <div class="sk" style="height:64px"></div><div class="gap"></div>
    <div class="sk" style="height:150px"></div>
  </div>
  <section class="screen" id="s-home"></section>
  <section class="screen" id="s-plans"></section>
  <section class="screen" id="s-connect"></section>
  <section class="screen" id="s-friends"></section>
  <section class="screen" id="s-profile"></section>
  <section class="screen" id="s-error"></section>
</main>

<div class="paybar" id="paybar" hidden><div id="paybar-in"></div></div>

<nav class="tabbar" id="tabbar" hidden><div>
  <button class="tab" data-tab="home"><svg class="i"><use href="#home"/></svg>Главная</button>
  <button class="tab" data-tab="plans"><svg class="i"><use href="#card"/></svg>Тарифы</button>
  <button class="tab" data-tab="connect"><svg class="i"><use href="#key"/></svg>Ключ</button>
  <button class="tab" data-tab="friends"><svg class="i"><use href="#users"/></svg>Друзья</button>
  <button class="tab" data-tab="profile"><svg class="i"><use href="#user"/></svg>Профиль</button>
</div></nav>

<div class="dim" id="dim"></div>
<div class="sheet"><div><div class="grab"></div><div id="sheet"></div></div></div>
<div class="done" id="done"></div>
<div class="toast" id="toast"></div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="home" viewBox="0 0 24 24"><path d="M4 10.2 12 4l8 6.2V19a1 1 0 0 1-1 1h-4.5v-5.5h-5V20H5a1 1 0 0 1-1-1z"/></symbol>
  <symbol id="card" viewBox="0 0 24 24"><rect x="3" y="5.5" width="18" height="13" rx="2.5"/><path d="M3 10h18M7 14.5h3"/></symbol>
  <symbol id="key" viewBox="0 0 24 24"><circle cx="8" cy="15" r="4"/><path d="m11 12 8.5-8.5M16.5 6.5l2.5 2.5M14.5 8.5l2 2"/></symbol>
  <symbol id="users" viewBox="0 0 24 24"><circle cx="9" cy="8.5" r="3.5"/><path d="M2.5 19.5a6.5 6.5 0 0 1 13 0M16 5.2a3.5 3.5 0 0 1 0 6.6M18 13.6a6.5 6.5 0 0 1 3.5 5.9"/></symbol>
  <symbol id="user" viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="4"/><path d="M4.5 20a7.5 7.5 0 0 1 15 0"/></symbol>
  <symbol id="gift" viewBox="0 0 24 24"><rect x="3.5" y="8" width="17" height="4" rx="1"/><path d="M12 8v12.5M5.5 12v7.5a1 1 0 0 0 1 1h11a1 1 0 0 0 1-1V12M12 8S11 4 8.3 4a2 2 0 0 0 0 4M12 8s1-4 3.7-4a2 2 0 0 1 0 4"/></symbol>
  <symbol id="chat" viewBox="0 0 24 24"><path d="M20 11.5a7.5 7.5 0 0 1-10.9 6.7L4.5 19.5l1.2-4.1A7.5 7.5 0 1 1 20 11.5z"/></symbol>
  <symbol id="check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
  <symbol id="copy" viewBox="0 0 24 24"><rect x="8.5" y="8.5" width="11" height="11" rx="2"/><path d="M15.5 8.5V6.5a2 2 0 0 0-2-2h-7a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h2"/></symbol>
  <symbol id="send" viewBox="0 0 24 24"><path d="M20.5 3.5 10 14M20.5 3.5l-6.5 17-4-6.5-6.5-4z"/></symbol>
  <symbol id="share" viewBox="0 0 24 24"><path d="M12 15V4M8 7.5 12 3.5l4 4M5 12v6.5a1.5 1.5 0 0 0 1.5 1.5h11a1.5 1.5 0 0 0 1.5-1.5V12"/></symbol>
  <symbol id="down" viewBox="0 0 24 24"><path d="M12 4v11M7.5 10.5 12 15l4.5-4.5M5 20h14"/></symbol>
  <symbol id="chevr" viewBox="0 0 24 24"><path d="m9.5 6 6 6-6 6"/></symbol>
  <symbol id="cal" viewBox="0 0 24 24"><rect x="4" y="5.5" width="16" height="15" rx="2"/><path d="M4 10h16M8.5 3.5v4M15.5 3.5v4"/></symbol>
  <symbol id="dev" viewBox="0 0 24 24"><rect x="3" y="5" width="13" height="10" rx="1.5"/><rect x="15" y="9" width="6" height="11" rx="1.5"/><path d="M6.5 19h6"/></symbol>
  <symbol id="shield" viewBox="0 0 24 24"><path d="M12 3.5 5 6v5.5c0 4.5 3 7.8 7 9 4-1.2 7-4.5 7-9V6z"/></symbol>
  <symbol id="hash" viewBox="0 0 24 24"><path d="M5 9h14M5 15h14M10 4.5 8.5 19.5M15.5 4.5 14 19.5"/></symbol>
  <symbol id="bot" viewBox="0 0 24 24"><rect x="4.5" y="8" width="15" height="11.5" rx="3"/><path d="M12 4.5V8M9.5 13h0M14.5 13h0M10 16.5h4"/></symbol>
  <symbol id="pin" viewBox="0 0 24 24"><path d="M12 20.5s-6.5-5.8-6.5-10.8a6.5 6.5 0 0 1 13 0c0 5-6.5 10.8-6.5 10.8z"/><circle cx="12" cy="9.8" r="2.3"/></symbol>
  <symbol id="plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
</svg>

<script>
(() => {
  const tg = window.Telegram && window.Telegram.WebApp;
  const initData = tg ? tg.initData : "";
  const me = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) || {};
  const $ = (q) => document.querySelector(q);
  const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const svg = (id, cls = "") => `<svg class="i ${cls}"><use href="#${id}"/></svg>`;
  const plural = (n, a, b, c) => { const t = n % 10, h = n % 100; return t === 1 && h !== 11 ? a : t >= 2 && t <= 4 && (h < 12 || h > 14) ? b : c; };
  const days = (n) => `${n} ${plural(n, "день", "дня", "дней")}`;
  const rub = (n) => `${Number(n).toLocaleString("ru-RU")} ₽`;
  const initials = (name) => String(name || "?").replace(/^@/, "").trim().split(/\s+/).map((w) => w[0]).join("").slice(0, 2).toUpperCase();

  const haptic = (k = "light") => {
    const h = tg && tg.HapticFeedback; if (!h) return;
    try { k === "success" || k === "error" || k === "warning" ? h.notificationOccurred(k) : k === "select" ? h.selectionChanged() : h.impactOccurred(k); } catch (e) {}
  };
  let toastT;
  const toast = (text) => { const t = $("#toast"); t.textContent = text; t.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), 2200); };

  async function api(path, body) {
    const r = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json", "X-Init-Data": initData }, body: JSON.stringify(body || {}) });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || "Что-то пошло не так. Попробуйте ещё раз.");
    return d;
  }
  const open = (url) => { if (!tg) return window.open(url, "_blank"); url.startsWith("https://t.me/") ? tg.openTelegramLink(url) : tg.openLink(url); };
  async function busy(btn, fn) {
    if (btn.disabled) return; const html = btn.innerHTML; btn.disabled = true; btn.innerHTML = `<span class="spin"></span>`;
    try { await fn(); } catch (e) { haptic("error"); toast(e.message); } finally { btn.disabled = false; btn.innerHTML = html; }
  }
  async function copy(text, msg) {
    try { await navigator.clipboard.writeText(text); }

  async function pay(btn) {
    const tariff = ui.plan, method = ui.method;
    haptic("medium");
    await busy(btn, async () => {
      const r = await api("/api/pay", { tariff, method });
      if (r.type === "paid") { setState(r.state); haptic("success"); showDone("Оплата прошла", `Подписка активна до ${S.subscription.expires}.`); }
      else if (r.type === "url") { ui.card = { payment_id: r.payment_id, tariff }; renderPaybar(); open(r.url); }
      else if (r.type === "invoice") {
        if (!tg || !tg.openInvoice) return open(r.url);
        tg.openInvoice(r.url, async (status) => {
          if (status === "paid") { haptic("success"); await waitPaid(); showDone("Оплата прошла", `Подписка активна до ${S.subscription.expires}.`); }
          else if (status === "failed") { haptic("error"); toast("Оплата не прошла"); }
        });
      }
    });
  }
  async function waitPaid() {
    const before = S.subscription.expires;
    for (let i = 0; i < 12; i++) {
      const st = await api("/api/state").catch(() => null);
      if (st && st.subscription.active && st.subscription.expires !== before) return setState(st);
      await new Promise((r) => setTimeout(r, 1000));
    }
    setState(await api("/api/state"));
  }

      ui.card = null; setState(r.state); haptic("success"); showDone("Оплата прошла", `Подписка активна до ${S.subscription.expires}.`);

    $("#s-error").innerHTML = `<div style="min-height:80vh;display:grid;place-items:center;text-align:center"><div>
      <div class="mark" style="width:64px;height:64px;border-radius:18px;font-size:34px;margin:0 auto 16px">Т</div>
      <h1>${esc(title)}</h1><p class="lead">${esc(text)}</p>${extra}</div></div>`;
    $("#s-error").classList.add("active");
  }

  (async () => {
    if (tg) {
      tg.ready(); tg.expand();
      try { tg.setHeaderColor("secondary_bg_color"); tg.setBackgroundColor("secondary_bg_color"); } catch (e) {}
      try { tg.disableVerticalSwipes && tg.disableVerticalSwipes(); } catch (e) {}
    }
    const hash = location.hash.replace("#", "");
    if (["home", "plans", "connect", "friends", "profile"].includes(hash)) ui.tab = hash;
    if (!initData) return fail("Откройте в Telegram", "Приложение работает внутри Telegram — откройте его через бота.");
    try { setState(await api("/api/state")); }
    catch (e) { fail("Не удалось загрузить", e.message, `<button class="btn main" onclick="location.reload()">Повторить</button>`); }
  })();
})();
</script>
</body>
</html>
